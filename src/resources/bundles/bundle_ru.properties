anomalies.decrypt.nodata = У юнита нет данных
anomalies.decrypt.far = Подойдите ближе к дешифровщику
unit.anomalies-ophan.name = Офан
anomalies.decrypt.custom = Это пользовательская карта: новые чертежи в древо знаний не добавляются
unit.anomalies-arux.name = Arux
unit.anomalies-arux.description = Тяжёлый шестиногий аномальный юнит (по три ноги с каждой стороны, каждая нога из трёх накладывающихся частей). Из щели в центре корпуса бьёт жёлтый лазер, как у Sublimate, пушка стреляет обычными шаровыми молниями, а два шокера на передних рогах выпускают короткие жёлтые молнии (3 блока) и резко отъезжают назад после выстрела. Улучшается из Alloy в мультипликативном реконструкторе (100 кинетического сплава, 200 кремния, 150 титана, 35 пластана).

block.anomalies-anomaly-absorber.name = Поглотитель аномалий
block.anomalies-anomaly-absorber.description = Работает как турель. Пока запитан, ловит лучом вражеские выпущенные аномалии (шаровые молнии Golden Ratio, Alloy, ArUx и турелей, а также зеркальный щит Alloy) в радиусе 8 клеток и поглощает их за 5 секунд. Не действует на свои и перманентные аномалии.

setting.anom-shader.name = Искажение пространства у аномалий (шейдеры)

setting.anom-shader-passes.name = Шейдеры аномалий: максимум эффектов за кадр
