block.anomalies-tzinch-block.name = Блок Тзинча
block.anomalies-tzinch-block.description = Вручную спавнит выбранную аномалию по заданным координатам тайлов.
anomaly.mirror = Зеркало
anomaly.distortion = Искажение
anomaly.time = Время
anomaly.vortex = Выверт

block.anomalies-rift-projector.name = Проектор разломов
block.anomalies-rift-projector.description = Накапливает энергию и выпускает два луча, которые задают начало и конец разлома аномалии «Зеркало». Проекция не реагирует на снаряды своей команды.
anomaly.ball = Шаровая молния
unit.anomalies-hunter.name = Охотник за аномалиями
unit.anomalies-hunter.description = Летающий юнит, который выслеживает аномалии и сжигает их синим лазером (около 20 секунд на аномалию). Создаётся на воздушной фабрике. Если войти в юнита, аномалию можно сжечь вручную: наведите курсор на аномалию и удерживайте кнопку огня.
anomaly.blackhole = Чёрная дыра
anomaly.warp = Варп
anomaly.fire = Огненный всплеск

anomaly.toxic = Токсик

block.anomalies-command-block.name = Командный блок
block.anomalies-command-block.description = Регулирует шанс появления каждой аномалии и включает/выключает «разрушение мира» (если выключено, чёрная дыра только пожирает постройки: не уничтожает стены и не превращает пол в космос).
anomalies.worlddestroy = Разрушение мира
anomalies.generation = Генерация аномалий
anomalies.chance = Шанс появления за бросок, %
anomalies.interval = Бросок каждые, сек

item.anomalies-polcim.name = Польцим
item.anomalies-polcim.description = Кристаллическая руда, которую оставляют после себя аномалии «Зеркало». Растворяется примерно через 20 минут.
block.anomalies-polcim-ore.name = Руда польцима

anomalies.alpha = Альфа-аномалии (в 2-3 раза больше)
anomalies.timekill = Временная аномалия уничтожает юнитов
anomalies.help = Подсказки:\n• Генерация аномалий — вкл/выкл автоматический спавн.\n• Шанс появления — вероятность каждой аномалии за один бросок, %.\n• Бросок каждые — как часто игра пытается заспавнить аномалию, сек.\n• Разрушение мира — если выкл., чёрная дыра только пожирает постройки.\n• Альфа-аномалии — аномалии бывают в 2-3 раза больше.\n• Временная уничтожает юнитов — если выкл., юнит, которого не было минуту назад, возвращается на самую раннюю точку за эту минуту, а не исчезает.\n• Юниты обходят аномалии — если вкл., наземные и морские юниты не заходят в опасные аномалии и скользят вдоль их края.\n• Аномалии не появляются ближе 10 блоков к точке высадки врагов.
anomalies.avoid = Юниты обходят аномалии

block.anomalies-anomaly-turret.name = Турель шаровой молнии
block.anomalies-anomaly-turret.description = Тратит 150 единиц энергии на выстрел и мгновенно создаёт готовую аномалию «Шаровая молния». Она летит сквозь препятствия и бьёт молниями только врагов. При выстреле на жёлтых выступах башни вспыхивают молнии.

unit.anomalies-alloy.name = Alloy
unit.anomalies-alloy.description = Шестиногий аномальный ходок. Накапливает альфа-шаровую молнию в центре корпуса и выпускает её вперёд (медленно, дальность 10 клеток). Несёт переносной проектор разломов, создающий перед ним зеркало шириной в 3 блока. Улучшается из Golden Ratio в обычном реконструкторе (20 кинетического сплава, 120 кремния, 50 титана, 50 пластана).
anomalies.on = Вкл
anomalies.off = Выкл
anomalies.generation.hint = Пока включено, аномалии появляются сами.
anomalies.worlddestroy.hint = Если выключено, чёрная дыра пожирает только постройки, а стены и пол не трогает.
anomalies.alpha.hint = Аномалии появляются в 2-3 раза больше.
anomalies.timekill.hint = Если включено, временная аномалия ещё и уничтожает юнитов.
anomalies.tz.alpha = Альфа (больше)
anomalies.tz.spawn = Создать
anomalies.tz.delete = Удалить аномалию
anomalies.tz.life = Время жизни, сек (0 = по умолчанию)

block.anomalies-anomaly-protector.name = Защитник от аномалий
block.anomalies-anomaly-protector.description = Пока запитан, не даёт аномалиям появляться в радиусе 10 клеток. Если подать в него польциум, радиус защиты расширится до 18 клеток (1 польциум держится 20 секунд).

anomalies.count = Количество попыток спавна за интервал (1-50)

block.anomalies-wall-breaker.name = Разрушитель стен
block.anomalies-wall-breaker.description = Когда запитан энергией, выпускает сразу три зелёных лазера, которые прожигают стены перед собой. Каждая клетка стены ломается спустя 30 секунд.

block.anomalies-seraph-core.name = Ядро «Серафим»
block.anomalies-seraph-core.description = Компактное ядро. При возрождении крышки раскрываются, выпускают Серафима со сложенными назад крыльями, крылья расправляются и ядро закрывается. Можно ставить в любом месте, если у команды уже есть ядро и хватает предметов.
block.anomalies-ophan-core.name = Ядро «Офан»
block.anomalies-ophan-core.description = Ядро для Офана. При возрождении крышки раздвигаются, внутри виден Офан со сложенными назад крыльями, он вылетает и расправляет крылья, после чего ядро закрывается. Можно ставить в любом месте, если у команды уже есть ядро и хватает предметов.
unit.anomalies-seraph.name = Серафим
unit.anomalies-seraph.description = Крылатый юнит ядра. Строит, добывает ресурсы и стреляет.

item.anomalies-tratat.name = Тратат
item.anomalies-tratat.description = Зелёный кристалл. Добывается только лазерным буром или лучше.
block.anomalies-tratat-ore.name = Руда тратата
block.anomalies-laser-block.name = Лазерный блок
block.anomalies-laser-block.description = Показывает светящуюся фиолетовую звезду. Поставьте ещё лазерные блоки в радиусе 17 клеток, выберите один и нажмите на другой, чтобы соединить их (до 3 соединений у блока): между каждой парой появится фиолетовый лазер, бьющий током всех врагов и вражеские постройки, попавшие под него. Повторное нажатие на соединённый блок разрывает связь.
anomaly.whirlpool = Водоворот

block.anomalies-data-block.name = Блок данных
block.anomalies-data-block.description = Хранит данные об одной постройке для разблокировки (выбирается в настройках блока). Встаньте юнитом в радиусе 4 клеток, чтобы скачать данные: между блоком и юнитом появится зелёная линия. Затем отнесите данные в дешифровщик.
block.anomalies-decryptor.name = Дешифровщик
block.anomalies-decryptor.description = Откройте его, находясь рядом, и нажмите «Загрузить данные». Через 30 секунд данные расшифруются, и можно будет забрать чертежи.
anomalies.data.got = Данные скачаны: {0}
anomalies.data.unlocked = Чертежи разблокированы: {0}
anomalies.decrypt.load = Загрузить данные
anomalies.decrypt.take = Забрать чертежи
anomalies.decrypt.idle = Данные не загружены
anomalies.decrypt.working = Дешифровка: {0}%
anomalies.decrypt.done = Расшифровано: {0}
anomalies.decrypt.nodata = У юнита нет данных
anomalies.decrypt.far = Подойдите ближе к дешифровщику
unit.anomalies-ophan.name = Офан
anomalies.decrypt.custom = Это пользовательская карта: новые чертежи в древо знаний не добавляются
unit.anomalies-arux.name = Arux
unit.anomalies-arux.description = Тяжёлый шестиногий аномальный юнит (по три ноги с каждой стороны, каждая нога из трёх накладывающихся частей). Из щели в центре корпуса бьёт жёлтый лазер, как у Sublimate, пушка стреляет обычными шаровыми молниями, а два шокера на передних рогах выпускают короткие жёлтые молнии (3 блока) и резко отъезжают назад после выстрела. Улучшается из Alloy в мультипликативном реконструкторе (100 кинетического сплава, 200 кремния, 150 титана, 35 пластана).

block.anomalies-anomaly-absorber.name = Поглотитель аномалий
block.anomalies-anomaly-absorber.description = Работает как турель. Пока запитан, ловит лучом вражеские выпущенные аномалии (шаровые молнии Golden Ratio, Alloy, ArUx и турелей, а также зеркальный щит Alloy) в радиусе 8 клеток и поглощает их за 5 секунд. Не действует на свои и перманентные аномалии.

setting.anom-shader.name = Искажение пространства у аномалий (шейдеры)

setting.anom-shader-passes.name = Шейдеры аномалий: максимум эффектов за кадр
item.anomalies-gold.name = Золото
item.anomalies-gold.description = Мягкий блестящий металл. Добывается так же тяжело, как титан.
block.anomalies-gold-ore.name = Руда золота
liquid.anomalies-liquid-gold.name = Жидкое золото
liquid.anomalies-liquid-gold.description = Расплавленное золото. Пока что просто жидкость.
item.anomalies-gold-nugget.name = Золотой кусочек
item.anomalies-gold-nugget.description = Небольшой кусочек золота.
item.anomalies-stone.name = Камень
item.anomalies-stone.description = Обычный камень.
block.anomalies-gold-crucible.name = Тигель золота
block.anomalies-gold-crucible.description = Плавит добытое золото: 5 золота превращаются в 3 единицы жидкого золота и 10 камня за секунду. Требует энергию (150 ед./с).
unit.anomalies-crocus.name = Крокус
unit.anomalies-crocus.description = Летающий юнит первого тира с воздушной фабрики. Стреляет жёлтым снарядом: в месте попадания 2 секунды бьют жёлтые молнии и наносят 50 урона в секунду каждому вражескому юниту в радиусе 1.5 блока. У пушки есть отдача, верхние уголки крыльев оставляют след. Улучшается до Герани.
block.anomalies-cryogenic-mold.name = Криогенная изложница
block.anomalies-cryogenic-mold.description = Замораживает жидкое золото в золотые кусочки. Берёт 4 единицы жидкого золота, криогенную жидкость и энергию (60 ед./с) и выдаёт 1 золотой кусочек раз в 5 секунд. При работе из неё идёт пар.
unit.anomalies-geranium.name = Герань
unit.anomalies-geranium.description = Летающий юнит второго тира, улучшение Крокуса в обычном реконструкторе (100 кремния, 10 кинетического сплава, 30 графита, 60 золотых кусочков). Стреляет шаровыми молниями как Golden Ratio, но они летят по прямой. При выстреле корпус слегка отдаёт назад. Крылья окрашиваются в цвет команды и повёрнуты внутрь на 10 градусов, три двигателя находятся в вырезах снизу корпуса.
block.anomalies-demolisher.name = Сноситель
block.anomalies-demolisher.description = Турель, стреляющая светящимися снарядами, один выстрел в 1.5 секунды. Боеприпасы: тратат - 115 урона и отбрасывание вражеских юнитов на полблока; титан - 90 урона и замедление попавшего юнита на 25%; торий - 115 урона. Снаряд светится цветом боеприпаса, при выстреле дуло отдаёт назад.
status.anomalies-demolisher-slow.name = Замедление
block.anomalies-cutter.name = Резак
block.anomalies-cutter.description = Заправляется золотыми кусочками. Стреляет светящимся снарядом, наносящим 100 урона; при выстреле позади него в стороны разлетаются осколки по 40 урона. Снаряд и осколки светятся цветом боеприпаса, при выстреле дуло отдаёт назад.
block.anomalies-emp-tower.name = ЭМИ вышка
block.anomalies-emp-tower.description = Если в радиусе 20 блоков есть вражеские летающие юниты, выпускает жёлтое излучение. Каждый вражеский летающий юнит, до которого оно дошло, останавливается и получает 50 урона в секунду от электрического тока; ток передаётся по воздуху на других вражеских летающих юнитов в радиусе 5 блоков от поражённого, образуя цепь молний. Эффект и молнии длятся 10 секунд, перезарядка между излучениями 20 секунд.
status.anomalies-emp-shock.name = Электрошок
block.anomalies-gold-wall.name = Золотая стена
block.anomalies-gold-wall.description = Стена из золотых кусочков.
unit.anomalies-nestor.name = Нестор
unit.anomalies-nestor.description = Крылатый летающий юнит. В центральном разрезе заряжается альфа шаровая молния (каждые 2.5 с), он стреляет ею, при выстреле юнит слегка отдаёт назад. Четыре свободно поворачивающиеся боковые пушки стреляют жёлтыми пулями как у Stell (1.5 с), две статичные передние пушки стреляют снарядом Разреза и оставляют 2 осколка (2 с); у всех пушек есть отдача. Крылья оставляют след вдоль всей задней части, пламя двигателя в заднем прорезе под ячейкой.
unit.anomalies-lavanda.name = Лаванда
unit.anomalies-lavanda.description = Левитирующий юнит. Статичное дуло стреляет фиолетовыми светящимися пулями (60 урона), которые при попадании распадаются на 3 светящихся осколка (по 20 урона: влево, вперёд и вправо), у дула небольшая отдача. По бокам эффект левитации как у Elude. Ячейка окрашена в цвет команды.
