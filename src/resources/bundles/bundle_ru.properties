block.anomalies-world-hologram-block.name = Мировая голограмма
block.anomalies-world-hologram-block.description = Голограмма, которую создатели карт ставят в редакторе карт или в песочнице. В игре её можно только смотреть и копировать рисунок, например чтобы вставить в дешифровщик.
block.anomalies-decryptor-block.name = Дешифровщик
block.anomalies-decryptor-block.description = Вставьте рисунок, скопированный из мировой голограммы. Спустя время он расшифрует его и откроет спрятанный в нём блок, ресурс или юнит, но только когда сектор захвачен или враг побеждён.
