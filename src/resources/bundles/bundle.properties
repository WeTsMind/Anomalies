anomaly.warp = Warp
anomaly.fire = Fire Burst

anomaly.toxic = Toxic

block.anomalies-command-block.name = Command Block
block.anomalies-command-block.description = Sets the spawn chance of each anomaly type and toggles World Destruction (when off, the Black Hole only devours buildings: no wall removal, no floor-to-space).
anomalies.worlddestroy = World destruction
anomalies.generation = Anomaly generation
