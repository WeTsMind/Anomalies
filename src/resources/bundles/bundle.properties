block.anomalies-rift-projector.name = Rift Projector
block.anomalies-rift-projector.description = Charges up on power and fires two beams that mark the start and end of a Mirror anomaly rift. The projection ignores bullets from its own team.
anomaly.ball = Ball Lightning
unit.anomalies-hunter.name = Anomaly Hunter
unit.anomalies-hunter.description = Flying unit that hunts down anomalies and burns them away with a blue laser (about 20 seconds per anomaly). Built in the Air Factory. Enter the unit to burn anomalies by hand: aim the cursor at an anomaly and hold the fire button.
anomaly.blackhole = Black Hole
anomaly.warp = Warp
anomaly.fire = Fire Burst

anomaly.toxic = Toxic

block.anomalies-command-block.name = Command Block
block.anomalies-command-block.description = Sets the spawn chance of each anomaly type and toggles World Destruction (when off, the Black Hole only devours buildings: no wall removal, no floor-to-space).
anomalies.worlddestroy = World destruction
anomalies.generation = Anomaly generation
anomalies.chance = Spawn chance per roll, %
anomalies.interval = Roll every, sec

item.anomalies-polcim.name = Polcim
item.anomalies-polcim.description = A crystalline ore left behind by Mirror anomalies. It dissolves after about 20 minutes.
block.anomalies-polcim-ore.name = Polcim Ore

anomalies.alpha = Alpha anomalies (2-3x bigger)
anomalies.timekill = Time anomaly destroys units
anomalies.help = Hints:\n• Anomaly generation - toggles automatic spawning.\n• Spawn chance - chance of each anomaly per roll, %.\n• Roll every - how often the game tries to spawn an anomaly, sec.\n• World destruction - when off, the Black Hole only devours buildings.\n• Alpha anomalies - anomalies can be 2-3x bigger.\n• Time destroys units - when off, a unit that did not exist a minute ago is returned to its earliest position within that minute instead of vanishing.\n• Units avoid anomalies - when on, ground and naval units do not enter dangerous anomalies and slide along their edge.\n• Anomalies never spawn within 10 blocks of the enemy drop point.
anomalies.avoid = Units avoid anomalies

block.anomalies-anomaly-turret.name = Ball Lightning Turret
block.anomalies-anomaly-turret.description = Spends 150 power units per shot to launch a ready-made Ball Lightning anomaly. It flies straight through walls and buildings and strikes only enemies. Lightning flashes on the yellow bumps of the turret when it fires.

unit.anomalies-alloy.name = Alloy
unit.anomalies-alloy.description = Six-legged anomaly walker. Charges an alpha ball lightning in its core and fires it forward (slow, 10 tiles range). Carries a portable rift projector that keeps a 3-tile wide mirror anomaly in front of it. Upgraded from Golden Ratio in the Additive Reconstructor (20 surge alloy, 120 silicon, 50 titanium, 50 plastanium).
anomalies.on = ON
anomalies.off = OFF
anomalies.generation.hint = Anomalies appear on their own while this is on.
anomalies.worlddestroy.hint = When off, the Black Hole only eats buildings and leaves walls and floor.
anomalies.alpha.hint = Anomalies spawn 2-3x bigger.
anomalies.timekill.hint = When on, the Time anomaly also kills units.
anomalies.tz.alpha = Alpha (bigger)
anomalies.tz.spawn = Spawn
anomalies.tz.delete = Delete anomaly
anomalies.tz.life = Life, sec (0 = default)

block.anomalies-anomaly-protector.name = Anomaly Protector
block.anomalies-anomaly-protector.description = While powered, prevents anomalies from spawning within 10 tiles. Feed it Polcim to extend the protected radius to 18 tiles (1 Polcim lasts 20 seconds).

anomalies.count = Anomaly rolls per interval (1-50)

block.anomalies-wall-breaker.name = Wall Breaker
block.anomalies-wall-breaker.description = When powered, fires three green lasers at once that burn through the walls in front of it. Each wall tile breaks after 30 seconds.

block.anomalies-seraph-core.name = Seraph Core
block.anomalies-seraph-core.description = A compact core. On respawn its lids open, release a Seraph with its wings folded back, the wings spread and the core closes. Can be placed anywhere if the team already has a core and the items.
block.anomalies-ophan-core.name = Ophan Core
block.anomalies-ophan-core.description = A core for the Ophan. On respawn its lids slide apart, the Ophan rests inside with its wings folded back, flies out and spreads its wings, then the core closes. Can be placed anywhere if the team already has a core and the items.
unit.anomalies-seraph.name = Seraph
unit.anomalies-seraph.description = Winged core unit. Builds, mines and shoots.

item.anomalies-tratat.name = Tratat
item.anomalies-tratat.description = A green crystal. Can only be mined with a laser drill or better.
block.anomalies-tratat-ore.name = Tratat Ore
block.anomalies-laser-block.name = Laser Block
block.anomalies-laser-block.description = Shows a glowing purple star. Place more Laser Blocks within 17 tiles, select one and tap another to link them (up to 3 links per block): a purple laser forms between each pair and shocks every enemy unit and building that touches it. Tap the linked block again to cut the link.
anomaly.whirlpool = Whirlpool

block.anomalies-data-block.name = Data Block
block.anomalies-data-block.description = Holds the data of one building to unlock (pick it in the block's settings). Stand within 4 tiles with your unit to download the data: a green line connects the block and your unit. Then carry the data to a Decryptor.
block.anomalies-decryptor.name = Decryptor
block.anomalies-decryptor.description = Open it with your unit nearby and press "Load data" to insert downloaded data. After 30 seconds the data is decrypted and you can take the blueprints.
anomalies.data.got = Data downloaded: {0}
anomalies.data.unlocked = Blueprints unlocked: {0}
