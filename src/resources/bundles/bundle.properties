unit.anomalies-ophan.name = Ophan
anomalies.decrypt.custom = This is a custom map: no new recipes are added to the tech tree
unit.anomalies-arux.name = Arux
unit.anomalies-arux.description = Heavy six-legged anomaly (three legs per side, each leg in three overlapping parts). A yellow Sublimate-style laser comes out of the slit in its hull, the cannon fires regular ball lightning, and two shockers on the front horns discharge short yellow lightning (3 tiles) and jerk back after every shot. Upgraded from Alloy in the Multiplicative Reconstructor (100 surge alloy, 200 silicon, 150 titanium, 35 plastanium).

block.anomalies-anomaly-absorber.name = Anomaly Absorber
block.anomalies-anomaly-absorber.description = Turret-like block. While powered, it catches enemy shot anomalies (ball lightning of Golden Ratio, Alloy, ArUx and turrets, and the Alloy mirror shield) within 8 tiles with a beam and absorbs them in 5 seconds. Does not affect your own anomalies or permanent anomalies.

setting.anom-shader.name = Anomaly space distortion (shaders)

setting.anom-shader-passes.name = Anomaly shaders: max effects per frame
