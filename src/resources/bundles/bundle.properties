anomalies.alpha = Alpha anomalies (2-3x bigger)
anomalies.timekill = Time anomaly destroys units
anomalies.help = Hints:\n• Anomaly generation - toggles automatic spawning.\n• Spawn chance - chance of each anomaly per roll, %.\n• Roll every - how often the game tries to spawn an anomaly, sec.\n• World destruction - when off, the Black Hole only devours buildings.\n• Alpha anomalies - anomalies can be 2-3x bigger.\n• Time destroys units - when off, a unit that did not exist a minute ago is returned to its earliest position within that minute instead of vanishing.\n• Units avoid anomalies - when on, ground and naval units do not enter dangerous anomalies and slide along their edge.\n• Anomalies never spawn within 10 blocks of the enemy drop point.
anomalies.avoid = Units avoid anomalies

block.anomalies-anomaly-turret.name = Ball Lightning Turret
block.anomalies-anomaly-turret.description = Spends 150 power units per shot to launch a ready-made Ball Lightning anomaly. It flies straight through walls and buildings and strikes only enemies. Lightning flashes on the yellow bumps of the turret when it fires.

unit.anomalies-alloy.name = Alloy
unit.anomalies-alloy.description = Six-legged anomaly walker. Charges an alpha ball lightning in its core and fires it forward (slow, 10 tiles range). Carries a portable rift projector that keeps a 3-tile wide mirror anomaly in front of it. Upgraded from Golden Ratio in the Additive Reconstructor (20 surge alloy, 120 silicon, 50 titanium, 50 plastanium).
anomalies.on = ON
anomalies.off = OFF
anomalies.generation.hint = Anomalies appear on their own while this is on.
anomalies.worlddestroy.hint = When off, the Black Hole only eats buildings and leaves walls and floor.
anomalies.alpha.hint = Anomalies spawn 2-3x bigger.
anomalies.timekill.hint = When on, the Time anomaly also kills units.
