anomalies.decrypt.far = Move closer to the Decryptor
unit.anomalies-ophan.name = Ophan
anomalies.decrypt.custom = This is a custom map: no new recipes are added to the tech tree
unit.anomalies-arux.name = Arux
unit.anomalies-arux.description = Heavy six-legged anomaly (three legs per side, each leg in three overlapping parts). A yellow Sublimate-style laser comes out of the slit in its hull, the cannon fires regular ball lightning, and two shockers on the front horns discharge short yellow lightning (3 tiles) and jerk back after every shot. Upgraded from Alloy in the Multiplicative Reconstructor (100 surge alloy, 200 silicon, 150 titanium, 35 plastanium).

block.anomalies-anomaly-absorber.name = Anomaly Absorber
block.anomalies-anomaly-absorber.description = Turret-like block. While powered, it catches enemy shot anomalies (ball lightning of Golden Ratio, Alloy, ArUx and turrets, and the Alloy mirror shield) within 8 tiles with a beam and absorbs them in 5 seconds. Does not affect your own anomalies or permanent anomalies.

setting.anom-shader.name = Anomaly space distortion (shaders)

setting.anom-shader-passes.name = Anomaly shaders: max effects per frame
item.anomalies-gold.name = Gold
item.anomalies-gold.description = A soft shiny metal. As hard to mine as titanium.
block.anomalies-gold-ore.name = Gold ore
liquid.anomalies-liquid-gold.name = Liquid gold
liquid.anomalies-liquid-gold.description = Molten gold. For now it is just a liquid.
item.anomalies-gold-nugget.name = Gold nugget
item.anomalies-gold-nugget.description = A small piece of gold.
item.anomalies-stone.name = Stone
item.anomalies-stone.description = A plain stone.
block.anomalies-gold-crucible.name = Gold Crucible
block.anomalies-gold-crucible.description = Smelts mined gold: 5 gold become 3 units of liquid gold and 10 stone each second. Needs power (150 units/s).
unit.anomalies-crocus.name = Crocus
unit.anomalies-crocus.description = Tier 1 flyer of the air factory. Fires a yellow bolt; where it hits, yellow lightning strikes from the point of impact for 2 seconds and deals 50 damage per second to every enemy unit within 1.5 tiles. The cannon kicks back when it fires, the upper corners of the wings leave a trail. Upgrades into the Geranium.
block.anomalies-cryogenic-mold.name = Cryogenic Mold
block.anomalies-cryogenic-mold.description = Freezes liquid gold into gold nuggets. Takes 4 units of liquid gold, cryofluid and power (60 units/s) and makes 1 gold nugget every 5 seconds. Steam rises while it works.
unit.anomalies-geranium.name = Geranium
unit.anomalies-geranium.description = Tier 2 flyer, an upgrade of the Crocus in the additive reconstructor (100 silicon, 10 surge alloy, 30 graphite, 60 gold nuggets). Fires the ball lightning of the Golden Ratio, but it flies straight. The craft kicks back a little when it fires. The wings are painted in the team colour and turned 10 degrees inwards, three engines sit in the cut-outs at the bottom of the hull.
block.anomalies-demolisher.name = Demolisher
block.anomalies-demolisher.description = A turret that fires glowing shells, one every 1.5 seconds. Ammo: tratat - 115 damage and pushes enemy units back half a block; titanium - 90 damage and slows the hit unit by 25%; thorium - 115 damage. The shell glows in the colour of the ammo, the barrel kicks back when it fires.
status.anomalies-demolisher-slow.name = Slowed
block.anomalies-cutter.name = Cutter
block.anomalies-cutter.description = Fed with gold nuggets. Fires a glowing shell for 100 damage; at the shot, shards fly apart behind it to both sides, 40 damage each. The shell and the shards glow in the colour of the ammo, the barrel kicks back when it fires.
block.anomalies-emp-tower.name = EMP Tower
block.anomalies-emp-tower.description = When an enemy flying unit is within 20 blocks, sends out a yellow radiation wave. Every enemy flyer it reaches is stopped and takes 50 damage per second from an electric current; the current jumps through the air to any other enemy flyer within 5 blocks of a shocked one, forming a chain of lightning. The shock and the lightning last 10 seconds, the cooldown between emissions is 20 seconds.
status.anomalies-emp-shock.name = Electric shock
block.anomalies-gold-wall.name = Gold Wall
block.anomalies-gold-wall.description = A wall made of gold nuggets.
unit.anomalies-nestor.name = Nestor
unit.anomalies-nestor.description = Winged flyer. The centre slit charges an alpha ball lightning (every 2.5 s) and fires it, the craft kicks back a little. Four free-turning side guns fire yellow Stell-style bolts (1.5 s), two static front guns fire the Cutter shell that leaves 2 shards (2 s); all guns recoil. The wings leave a trail along the whole rear edge, the engine flame sits in the rear slit under the cell.
unit.anomalies-lavanda.name = Lavanda
unit.anomalies-lavanda.description = Ground hover unit. A rotating turret fires glowing violet bullets (60 damage) that break into 3 glowing shards (20 damage each: left, ahead, right) when they hit; the muzzle recoils a little. Hover rings on both sides, like the Elude. The cell is painted in the team colour.
unit.anomalies-test01.name = TEST01
unit.anomalies-test01.description = Flying builder made of a chain of rotating segments that follow the head with a lag.
